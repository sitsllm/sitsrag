[project]
name = "sitsrag"
version = "0.1.0"
description = "RAG system for the SITS R Package documentation"
requires-python = ">=3.11"
dependencies = [
    # Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "uvicorn-worker>=0.3.0",
    "gunicorn>=23.0.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "pyfiglet>=1.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    # HTTP
    "httpx>=0.28.0",
    # Database — SQLite only (no server)
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.22.1",
    "sqlite-vec>=0.1.9",
    # LLM & AI
    "litellm>=1.78.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=0.4.0",
    "ag-ui-langgraph>=0.0.32",
    "copilotkit>=0.1.86",
    # Local embeddings
    "fastembed>=0.8.0",
    # Data transformation
    "pydash>=8.0.0",
    # Logging
    "structlog>=24.0.0",
    "langchain-cohere>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]
parsers = [
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
]
ontology = [
    "rdflib>=7.0.0",
]
observability = [
    "langfuse>=2.60.0,<3.0.0",
]
recommended = [
    "sitsrag[parsers,ontology,observability]",
]
all = [
    "sitsrag[parsers,ontology,observability]",
]

[project.scripts]
sitsrag = "sitsrag.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["sitsrag"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "UP",  # pyupgrade
    "I",   # isort
    "N",   # pep8 naming
    "PL",  # pylint
]
ignore = ["PLC0415", "PLR0915", "PLR2004", "E501", "PLR0913", "PLR0912"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
