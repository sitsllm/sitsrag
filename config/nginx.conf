#
# This file is part of SITS RAG.
#
# SSE-friendly reverse proxy for the SITS RAG API.
#

worker_processes auto;
events {
    worker_connections 1024;
}

http {
    upstream sits_rag {
        server app:8000;
        keepalive 32;
    }

    # Per-IP rate limit for the agent endpoint. Runs before the app (cross-worker,
    # free), so one abuser can't spam LLM calls. The app global daily ceiling is
    # the separate, primary solvency control. ~30 req/min is generous for a human,
    # restrictive for a script. Controled using the real client IP (see set_real_ip_from).
    limit_req_zone $binary_remote_addr zone=agui:10m rate=30r/m;
    limit_req_status 429;

    # Trust the forwarded IP (e.g.m behind Cloudflare / a platform LB) so the rate
    # limit keys on the visitor, not the proxy.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    server {
        listen 80;
        server_name _;

        # Shared proxy settings
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # SSE essentials (Do not buffer or cache streamed responses)
        proxy_buffering            off;
        proxy_cache                off;
        proxy_read_timeout         1h;
        proxy_send_timeout         1h;
        chunked_transfer_encoding  on;

        # Rate-limited agent endpoint (bursts allowed, then 429)
        location = /agui/agent {
            limit_req zone=agui burst=10 nodelay;
            proxy_pass http://sits_rag;
        }

        location / {
            proxy_pass http://sits_rag;
        }
    }
}
